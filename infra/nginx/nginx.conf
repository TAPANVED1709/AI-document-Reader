events {}
http {
  client_max_body_size 20m;
  upstream web { server web:3000; }
  upstream api { server api:8080; }
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id; }
    location /health { proxy_pass http://api; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
